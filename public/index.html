<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Master Quiz — Master Responsable Communication</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,500&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10192E; --ink-2:#1B2A4A; --coral:#FF5A3C; --lime:#C8FF4D; --slate:#5C6B8A;
    --paper:#F5F2EA; --paper-2:#EDE8DC; --line:#DAD3C2;
    --cat-culture:#5B6EE1; --cat-pub:#FF5A3C; --cat-social:#1E9E8B; --cat-marque:#D98A2B; --cat-manager:#8B5CA8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em;}
  .question-prompt{font-family:'Newsreader',serif;}

  header.hero{background:var(--ink);color:var(--paper);padding:20px 24px 16px;position:sticky;top:0;z-index:50;border-bottom:3px solid var(--lime);}
  .hero-inner{max-width:820px;margin:0 auto;}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:0.16em;color:var(--lime);font-weight:600;margin-bottom:6px;}
  .hero h1{font-size:clamp(22px,4vw,30px);margin:0 0 4px;font-weight:700;}
  .hero p.sub{margin:0;color:#B7C0D6;font-size:13.5px;max-width:640px;line-height:1.5;}

  main{max-width:820px;margin:0 auto;padding:18px 20px 130px;}

  .progress-strip{display:flex;gap:4px;margin-bottom:22px;flex-wrap:wrap;}
  .dot{width:100%;height:6px;border-radius:3px;background:var(--line);cursor:default;border:none;padding:0;flex:1;min-width:8px;}
  .dot.done{background:var(--slate);}
  .dot.current{background:var(--ink-2);}
  .dot.clickable{cursor:pointer;}
  .dot.clickable:hover{background:var(--coral);}

  .qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 24px 22px;}
  .qcard.graded{box-shadow:inset 0 0 0 2px var(--lime);}
  .qcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;}
  .cat-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:20px;color:#fff;}
  .qnum{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--slate);}
  .points-chip{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .points-chip.earned{background:var(--lime);border-color:var(--lime);color:var(--ink);}
  .prompt{font-size:19px;line-height:1.45;margin:10px 0 14px;color:var(--ink);}
  .sub-note{font-size:13px;color:var(--slate);margin:-6px 0 14px;}

  .aid-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .aid-btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);cursor:pointer;transition:all .15s ease;}
  .aid-btn:hover:not(:disabled){border-color:var(--coral);color:var(--coral);}
  .aid-btn.active{background:var(--ink-2);color:#fff;border-color:var(--ink-2);}
  .aid-btn:disabled{opacity:.35;cursor:not-allowed;}
  .aid-btn .cost{color:var(--coral);font-weight:700;}
  .aid-btn.active .cost{color:var(--lime);}

  .hint-box{background:#FFF6E8;border:1px dashed #D9A441;border-radius:8px;padding:10px 14px;font-size:14px;font-style:italic;margin-bottom:14px;color:#7A5410;}

  textarea, input[type=text]{width:100%;font-family:'Inter',sans-serif;font-size:14.5px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;resize:vertical;background:var(--paper);color:var(--ink);}
  textarea:focus, input[type=text]:focus{outline:none;border-color:var(--coral);}
  textarea:disabled, input:disabled{background:var(--paper-2);color:var(--slate);}

  .options-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .opt-label{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-size:14.5px;transition:border-color .15s ease, background .15s ease;}
  .opt-label:hover{border-color:var(--slate);}
  .opt-label.picked{border-color:var(--ink-2);background:var(--paper-2);}

  .actions-row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .btn-blue{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;border:none;background:#2454E8;color:#fff;cursor:pointer;}
  .btn-blue:hover:not(:disabled){background:#1c41c2;}
  .btn-blue:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;}

  .submitted-tag{font-size:13px;font-weight:600;color:var(--slate);display:flex;align-items:center;gap:6px;margin-top:10px;}
  .submitted-tag::before{content:"✓";color:#1E7A46;font-weight:700;}

  .feedback-panel{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px;}
  .feedback-panel.ok{background:#E9F7EE;border:1px solid #1E7A46;color:#134D2C;}
  .feedback-panel.ko{background:#FFECE7;border:1px solid var(--coral);color:#8a2c1a;}
  .feedback-panel.pending{background:#F0F4FF;border:1px solid #2454E8;color:#1a2e6b;}

  .list-item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line);}
  .list-item:first-child{border-top:none;padding-top:0;}
  .list-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .list-item-label{font-family:'Newsreader',serif;font-size:16px;font-style:italic;}
  .mini-btn{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;margin-top:8px;}
  .mini-btn:disabled{opacity:.5;cursor:not-allowed;}

  .identity-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}

  .identity-field input{padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:15px;width:100%;}
  .identity-field input:focus{outline:none;border-color:var(--coral);}

  .match-wrap{position:relative;display:flex;justify-content:space-between;gap:60px;padding:10px 0;}
  .match-col{display:flex;flex-direction:column;gap:10px;flex:1;position:relative;z-index:2;}
  .match-item{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper-2);font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s ease;}
  .match-item:hover{border-color:var(--coral);}
  .match-item.selected{border-color:#2454E8;background:#E7EDFF;}
  .match-item.connected{border-color:var(--ink-2);}
  .match-item.correct-item{border-color:#1E7A46;background:#E9F7EE;}
  .match-item.incorrect-item{border-color:var(--coral);background:#FFECE7;}
  .match-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}

  .nav-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:40;}

  .final-panel h2{color:var(--lime);font-size:24px;margin-top:0;}

  @media (max-width:560px){ .qcard{padding:18px;} .prompt{font-size:17px;} .match-wrap{gap:24px;} }

</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Master Responsable Communication · Rentrée</div>
    <h1>Le Master Quiz</h1>
    <p class="sub">Répondez spontanément — chaque aide demandée réduit les points. Ce n'est pas un filtre, mais un révélateur.</p>
  </div>
</header>

<main>
  <div class="progress-strip" id="progressStrip"></div>
  <div id="slideRoot"></div>
</main>

<div class="nav-bar">
  <button class="nav-btn" id="prevBtn">← Précédent</button>
  <span class="center-label" id="navLabel">Identification</span>
  <button class="nav-btn next" id="nextBtn">Suivant →</button>
</div>

<script>
const CATS = {

const QUESTIONS = [
  { id:"q1", cat:"culture", type:"open", points:10,
    prompt:"Quel événement récent vous semble le plus marquant de l'actualité internationale ? Pourquoi ?" },

      {label:"Voir 4 possibilités", points:3, type:"mcq",
        options:["Les violences faites aux femmes","L'égalité hommes/femmes","Le cancer du sein","L'endométriose"], correct:2}
    ],
    autoCheckKeywords:["cancer du sein"] },

  { id:"q3", cat:"culture", type:"open", points:10,
    prompt:"Selon vous, quels sont les principaux risques liés à l'utilisation de l'I.A en communication ?" },

    prompt:"Que signifie l'expression « POV » sur TikTok ?",
    levels:[

      {label:"Demander un indice", points:5, type:"text", hint:"Joli quand on est au sommet"},
      {label:"Voir 4 possibilités", points:3, type:"mcq",

    autoCheckKeywords:["point of view"] },

  { id:"q5", cat:"marque", type:"aided",
    prompt:"Quelle marque est devenue virale grâce aux baskets Samba ?",
    levels:[
      {label:"Je réponds sans aide", points:10, type:"text"},
      {label:"Demander un indice", points:5, type:"text", hint:"Adi Dassler en serait fier"},
      {label:"Voir 4 possibilités", points:3, type:"mcq",
        options:["Nike","Reebok","Adidas","Puma"], correct:2}

    autoCheckKeywords:["adidas"] },

  { id:"q6", cat:"marque", type:"choiceExplain",

      {label:"« Faire du ciel le plus bel endroit sur terre »", correct:"Air France", options:["Easyjet","Qatar Airways","Air France","American Express"]},
      {label:"« Vivons la happy technologie »", correct:"Boulanger", options:["Dyson","Darty","Boulanger","LG"]},
      {label:"« Tous unis contre la vie chère »", correct:"E.Leclerc", options:["Intermarché","Boulanger","Emmaüs France","E.Leclerc"]}
    ] },

  { id:"q8", cat:"marque", type:"aided",
    prompt:"Quelle marque a inventé le Père Noël (Santa Claus) dans sa version manteau rouge et barbe blanche ?",
    levels:[
      {label:"Je réponds sans aide", points:10, type:"text"},
      {label:"Demander un indice", points:5, type:"text", hint:"Bulles américaines"},
      {label:"Voir 4 possibilités", points:3, type:"mcq",
        options:["7 Up","Coca-Cola","Pepsi Cola","Budweiser"], correct:1}
    ],
    autoCheckKeywords:["coca-cola","coca cola","coca"] },

  { id:"q9", cat:"pub", type:"open", points:10,
    prompt:"Si le slogan « Just do it » n'était pas celui de Nike, à quelle marque pourrait-il convenir parfaitement ? Expliquez." },

  { id:"q11", cat:"marque", type:"aided",
    prompt:"Quelle marque est célèbre pour avoir affirmé « Don't buy this jacket » dans une publicité ?",
    levels:[
      {label:"Je réponds sans aide", points:10, type:"text"},
      {label:"Demander un indice", points:5, type:"text", hint:"Marque au sommet"},
      {label:"Voir 4 possibilités", points:3, type:"mcq",
        options:["The North Face","Patagonia","Colombia","Salomon"], correct:1}
    ],
    autoCheckKeywords:["patagonia"] },

  { id:"q12", cat:"marque", type:"aided",
    prompt:"Quelle marque est associée à la signature sonore « Ta-dum » ?",
    levels:[
      {label:"Je réponds sans aide", points:10, type:"text"},
      {label:"Demander un indice", points:5, type:"text", hint:"Quelle que soit la saison"},
      {label:"Voir 4 possibilités", points:3, type:"mcq",
        options:["Netflix","SNCF","McDonald's","Apple (sonorité de démarrage)"], correct:0}
    ],
    autoCheckKeywords:["netflix"] },

  { id:"q13", cat:"pub", type:"aided",
    prompt:"À quelle marque « Reef » est-elle associée ?",
    levels:[
      {label:"Je réponds sans aide", points:10, type:"text"},
      {label:"Demander un indice", points:5, type:"text", hint:"Réponse libre !"},
      {label:"Voir 4 possibilités", points:3, type:"mcq",
        options:["Red Bull","Go Pro","Free","Liberté"], correct:2}
    ],
    autoCheckKeywords:["free"] },

  { id:"q14", cat:"pub", type:"mcqSingle", points:5, correct:3,
    prompt:"Lequel de ces slogans n'a jamais existé ?",
    options:[
      "A. Buvez-pissez (Vittel)","B. Secouez-moi, secouez-moi (Orangina)",
      "C. Mais qu'est-ce que t'as doudou dis-don ? (Oasis)","D. Et ta mère, elle mange du camembert ? (Camembert Le Petit)",
      "E. Babette, je la prends, je la fouette (Babette/Candia)","F. 20 cm de pur bonheur (Morteau Saucisse)"
    ] },

  { id:"q10", cat:"marque", type:"aided",
    prompt:"Quelle marque utilise le « swoosh » dans son logo ?",
    levels:[
      {label:"Je réponds sans aide", points:10, type:"text"},
      {label:"Demander un indice", points:5, type:"text", hint:"À la virgule près"},
      {label:"Voir 4 possibilités", points:3, type:"mcq",
        options:["Amazon","Coca-Cola","Nike","Apple"], correct:2}
    ],
    autoCheckKeywords:["nike"] },

  { id:"stars", cat:"social", type:"listOpen",
    prompt:"Citez au moins une marque représentée par chacune de ces personnalités.",
    items:[
      {label:"Rihanna", points:2},{label:"Jean Dujardin", points:2},{label:"Inoxtag", points:2},
      {label:"Squeezie", points:2},{label:"Zendaya", points:2},{label:"Billie Eilish", points:2},
      {label:"Léna Situations", points:2},{label:"Kylian Mbappé", points:2},
      {label:"Kendall Jenner", points:2},{label:"Aya Nakamura", points:2}
    ] },

  { id:"artists", cat:"pub", type:"matching",
    prompt:"Reliez chaque artiste à la marque avec laquelle il/elle a collaboré.",
    note:"Cliquez un artiste puis la marque correspondante pour tracer le trait. 2 points par bonne association.",
    left:["Victor Vasarely","Salvador Dalí","Keith Haring","Andy Warhol","Jeff Koons"],
    right:["Chupa Chups","Louis Vuitton","Renault","Swatch","Campbell's Soup"],
    pairs:{"Victor Vasarely":"Renault","Salvador Dalí":"Chupa Chups","Keith Haring":"Swatch","Andy Warhol":"Campbell's Soup","Jeff Koons":"Louis Vuitton"},
    pointsEach:2 },

  { id:"q15", cat:"manager", type:"open", points:10,
    prompt:"Comment feriez-vous parler une marque… sans utiliser de publicité ? (Donnez au moins 3 idées)" },

  { id:"q16", cat:"pub", type:"open", points:10,
    prompt:"Si Amazon était une personne, comment la décririez-vous ?" },

  { id:"q17", cat:"pub", type:"open", points:10,
    prompt:"Expliquez pourquoi la publicité Volkswagen reprenant les codes visuels de Superman est simple et efficace." },

  { id:"q18", cat:"manager", type:"open", points:10,
    prompt:"Selon vous, quelles qualités humaines sont essentielles aujourd'hui pour manager une équipe ?" },

  { id:"q19", cat:"manager", type:"ungraded",
    prompt:"Pourquoi souhaiteriez-vous travailler dans les métiers de la communication et qu'attendez-vous de cette formation ?" }
];

/* ---------- helpers ---------- */
function normalize(s){
  return (s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  }
  return dp[m][n];
}
function fuzzyMatch(input, keywords){
  const ni = normalize(input);
  if(!ni) return false;
  return keywords.some(k=>{
    const nk = normalize(k);
    if(ni.includes(nk) || (nk.length>3 && nk.includes(ni))) return true;
    const dist = levenshtein(ni, nk);
    const threshold = Math.max(2, Math.round(nk.length*0.3));
    return dist <= threshold;
  });
}

/* ---------- state ---------- */
const state = {};
QUESTIONS.forEach(q => state[q.id] = { submitted:false, earned:0, answerText:undefined, needsManualGrade:false });

function maxPossible(q){
  if(q.type==="open") return q.points;
  if(q.type==="aided") return q.levels[0].points;
  if(q.type==="choiceExplain") return q.pointsChoice + q.pointsExplain;
  if(q.type==="mcqSingle") return q.points;
  if(q.type==="listSlogans") return q.items.length*2;
  if(q.type==="listOpen") return q.items.reduce((s,it)=>s+it.points,0);
  if(q.type==="matching") return q.left.length*q.pointsEach;
  if(q.type==="ungraded") return 0;
  return 0;
}
function needsManual(q){ return q.type==="open" || q.type==="choiceExplain" || q.type==="listOpen"; }
const TOTAL_MAX = QUESTIONS.reduce((s,q)=>s+maxPossible(q),0);

/* ---------- navigation ---------- */
let currentIndex = 0;
const TOTAL_SLIDES = QUESTIONS.length + 2; // identity + questions + final

function isIdentityComplete(){
  const ln = document.getElementById('lastName'), fn = document.getElementById('firstName');
  return !!(ln && fn && ln.value.trim() && fn.value.trim());
}
function isSubmitted(i){
  if(i===0) return isIdentityComplete();
  if(i>=1 && i<=QUESTIONS.length) return !!state[QUESTIONS[i-1].id].submitted;
  return true;
}
function renderProgress(){
  const strip = document.getElementById('progressStrip');
  strip.innerHTML = '';
  for(let i=0;i<TOTAL_SLIDES;i++){
    const d = document.createElement('button');
    d.className = 'dot' + (i===currentIndex?' current':'') + (isSubmitted(i)&&i!==currentIndex?' done':'');
    const reachable = i<=currentIndex || (i>0 && isSubmitted(i-1)) || i===0;
    if(reachable){ d.className += ' clickable'; d.addEventListener('click', ()=>goTo(i)); }
    else { d.disabled = true; }
    strip.appendChild(d);
  }
}
function renderNav(){
  const label = document.getElementById('navLabel');
  if(currentIndex===0) label.textContent = 'Identification';
  else if(currentIndex<=QUESTIONS.length) label.textContent = `Question ${currentIndex} / ${QUESTIONS.length}`;
  else label.textContent = 'Fin du quiz';
  document.getElementById('prevBtn').disabled = currentIndex===0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = currentIndex>=TOTAL_SLIDES-1 || !isSubmitted(currentIndex);
}
function goTo(i){
  if(i<0 || i>=TOTAL_SLIDES) return;
  const reachable = i<=currentIndex || (i>0 && isSubmitted(i-1)) || i===0;
  if(!reachable) return;
  document.querySelectorAll('.slide').forEach(s=> s.style.display='none');
  document.getElementById('slide-'+i).style.display='';
  currentIndex = i;
  window.scrollTo({top:0, behavior:'smooth'});
  renderProgress(); renderNav();
  if(matchingRedraws[i]) setTimeout(matchingRedraws[i], 30);
}
document.getElementById('prevBtn').addEventListener('click', ()=> goTo(currentIndex-1));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(currentIndex+1));
window.addEventListener('resize', ()=> { if(matchingRedraws[currentIndex]) matchingRedraws[currentIndex](); });

/* ---------- per-question renderers ---------- */
function renderQuestion(q, num, slideIdx){
  const card = document.createElement('div');
  card.className = 'qcard';
  card.id = 'card-'+q.id;

  const head = document.createElement('div');
  head.className = 'qcard-head';
  const max = maxPossible(q);
  head.innerHTML = `<span class="cat-tag" style="background:${CATS[q.cat].color}">${CATS[q.cat].label}</span>
    <span class="points-chip" id="chip-${q.id}">${q.type==='ungraded' ? 'Non noté' : '/ '+max+' pts'}</span>`;
  card.appendChild(head);

  const num_p = document.createElement('div');
  num_p.className = 'qnum'; num_p.style.marginTop='10px'; num_p.textContent = 'Question '+num;
  card.appendChild(num_p);

  const prompt = document.createElement('p');
  prompt.className = 'prompt question-prompt';
  prompt.textContent = q.prompt;
  card.appendChild(prompt);

  if(q.note){ const note = document.createElement('p'); note.className='sub-note'; note.textContent=q.note; card.appendChild(note); }

  const body = document.createElement('div');
  card.appendChild(body);

  if(q.type==="open") renderOpen(q, body, card);
  else if(q.type==="aided") renderAided(q, body, card);
  else if(q.type==="choiceExplain") renderChoiceExplain(q, body, card);
  else if(q.type==="mcqSingle") renderMcqSingle(q, body, card);
  else if(q.type==="listSlogans") renderListSlogans(q, body, card);
  else if(q.type==="listOpen") renderListOpen(q, body, card);
  else if(q.type==="matching") renderMatching(q, body, card, slideIdx);
  else if(q.type==="ungraded") renderUngraded(q, body, card);

  return card;
}

function lockChip(qid, val, earned){
  const chip = document.getElementById('chip-'+qid);
  if(chip){ chip.textContent = val; if(earned) chip.classList.add('earned'); }
}
function markSubmitted(card){ card.classList.add('graded'); }

function renderOpen(q, body, card){
  const ta = document.createElement('textarea');
  ta.rows = 4; ta.placeholder = "Votre réponse…";
  body.appendChild(ta);
  const actions = document.createElement('div');
  actions.className = 'actions-row';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn-blue';
  submitBtn.textContent = 'Valider ma réponse';
  actions.appendChild(submitBtn);
  body.appendChild(actions);
  const feedbackZone = document.createElement('div');
  body.appendChild(feedbackZone);

  submitBtn.addEventListener('click', () => {
    if(state[q.id].submitted) return;
    ta.disabled = true; submitBtn.disabled = true;
    state[q.id].submitted = true;
    state[q.id].answerText = ta.value.trim() || "(pas de réponse)";
    state[q.id].earned = 0;
    state[q.id].needsManualGrade = true;
    markSubmitted(card);
    const fb = document.createElement('div');
    fb.className = 'feedback-panel pending';
    fb.innerHTML = `<strong>Réponse envoyée</strong> — sera corrigée par votre professeur.`;
    feedbackZone.appendChild(fb);
    renderProgress(); renderNav();
  });
}

function renderAided(q, body, card){
  const aidRow = document.createElement('div');
  aidRow.className = 'aid-row';
  const buttons = [];
  q.levels.forEach((lvl, i) => {
    const b = document.createElement('button');
    b.className = 'aid-btn' + (i===0 ? ' active' : '');
    const cost = q.levels[0].points - lvl.points;
    b.innerHTML = i===0 ? lvl.label : `${lvl.label} <span class="cost">(−${cost} pts)</span>`;
    b.addEventListener('click', () => selectLevel(i));
    aidRow.appendChild(b);
    buttons.push(b);
  });
  body.appendChild(aidRow);

  const hintBox = document.createElement('div');
  hintBox.style.display = 'none';
  body.appendChild(hintBox);
  const answerZone = document.createElement('div');
  body.appendChild(answerZone);

  const actions = document.createElement('div');
  actions.className = 'actions-row';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn-blue';
  submitBtn.textContent = 'Valider ma réponse';
  actions.appendChild(submitBtn);
  body.appendChild(actions);
  const feedbackZone = document.createElement('div');
  body.appendChild(feedbackZone);

  let currentLevel = 0, lockedFloor = 0, selectedOption = null, textValue = "";

  function selectLevel(i){
    if(i < lockedFloor) return;
    currentLevel = i; lockedFloor = Math.max(lockedFloor, i);
    buttons.forEach((b,bi)=>{ b.classList.toggle('active', bi===i); b.disabled = bi < lockedFloor; });
    const lvl = q.levels[i];
    hintBox.style.display = lvl.hint ? 'block' : 'none';
    if(lvl.hint) hintBox.innerHTML = `<div class="hint-box">💡 Indice : « ${lvl.hint} »</div>`;
    renderAnswerZone(lvl);
    lockChip(q.id, '/ '+lvl.points+' pts');
  }
  function renderAnswerZone(lvl){
    answerZone.innerHTML = '';
    if(lvl.type === 'text'){
      const input = document.createElement('input');
      input.type = 'text'; input.placeholder = 'Votre réponse…'; input.value = textValue;
      input.addEventListener('input', ()=> textValue = input.value);
      answerZone.appendChild(input);
    } else if(lvl.type === 'mcq'){
      const list = document.createElement('div');
      list.className = 'options-list';
      lvl.options.forEach((opt, oi) => {
        const label = document.createElement('label');
        label.className = 'opt-label' + (selectedOption===oi ? ' picked' : '');
        label.innerHTML = `<input type="radio" name="mcq-${q.id}" ${selectedOption===oi?'checked':''}> ${opt}`;
        label.addEventListener('click', () => {
          selectedOption = oi;
          [...list.children].forEach(c=>c.classList.remove('picked'));
          label.classList.add('picked');
        });
        list.appendChild(label);
      });
      answerZone.appendChild(list);
    }
  }
  selectLevel(0);

  submitBtn.addEventListener('click', () => {
    if(state[q.id].submitted) return;
    const lvl = q.levels[currentLevel];
    let autoCorrect = null;
    if(lvl.type === 'mcq'){ autoCorrect = (selectedOption === lvl.correct); }
    else if(q.autoCheckKeywords){ autoCorrect = fuzzyMatch(textValue, q.autoCheckKeywords); }
    const earned = autoCorrect ? lvl.points : 0;
    state[q.id].submitted = true; state[q.id].earned = earned;
    state[q.id].answerText = (lvl.type==='mcq' ? (selectedOption!==null ? lvl.options[selectedOption] : "(pas de réponse)") : (textValue.trim() || "(pas de réponse)")) + " [niveau: "+lvl.label+"]";
    markSubmitted(card);
    lockChip(q.id, earned+' / '+q.levels[0].points+' pts', true);
    buttons.forEach(b=>b.disabled = true);
    submitBtn.disabled = true;
    answerZone.querySelectorAll('input').forEach(el=>el.disabled = true);

    const correctAnswerText = lvl.type==='mcq' ? lvl.options[lvl.correct] : (q.autoCheckKeywords ? q.autoCheckKeywords[0] : null);
    const fb = document.createElement('div');
    fb.className = 'feedback-panel ' + (autoCorrect ? 'ok' : 'ko');
    fb.innerHTML = `<strong>${autoCorrect ? '✓ Bonne réponse' : '✗ Réponse incorrecte'} (+${earned} pts)</strong>` +
      (correctAnswerText ? `<div style="margin-top:4px;">Réponse attendue : <strong>${correctAnswerText}</strong></div>` : '');
    feedbackZone.appendChild(fb);
    renderProgress(); renderNav();
  });
}

function renderListSlogans(q, body, card){

    headRow.innerHTML = `<span class="list-item-label">${it.label}</span><span class="points-chip" id="mchip-${q.id}-${ii}">/ 2 pts</span>`;
    row.appendChild(headRow);
    const answerZone = document.createElement('div');

    answerZone.appendChild(input);
    row.appendChild(answerZone);
    const aidBtn = document.createElement('button');

      itemState[ii].level = 'aided';

      document.getElementById('mchip-'+q.id+'-'+ii).textContent = '/ 1 pt';
      answerZone.innerHTML = '';
      const optList = document.createElement('div');

        label.addEventListener('click', () => {

        });
        optList.appendChild(label);

  });

  const actions = document.createElement('div');
  actions.className = 'actions-row';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn-blue';
  submitBtn.textContent = 'Valider mes réponses';

  body.appendChild(actions);

    state[q.id].submitted = true; submitBtn.disabled = true;
    let total = 0;
    const lines = [];
    q.items.forEach((it, ii) => {
      const st = itemState[ii];
      let earned = 0, correct = false;
      if(st.level === 'aided'){ correct = st.option === it.correct; earned = correct ? 1 : 0; }
      else { correct = fuzzyMatch(st.text, [it.correct]); earned = correct ? 2 : 0; }
      total += earned;
      lines.push(it.label + " : " + (st.level==='aided' ? (st.option||"(pas de réponse)") : (st.text.trim()||"(pas de réponse)")));

      fb.innerHTML = `${correct?'✓':'✗'} Réponse attendue : <strong>${it.correct}</strong>`;
      rows[ii].row.appendChild(fb);
    });
    state[q.id].earned = total;
    state[q.id].answerText = lines.join(" / ");
    markSubmitted(card);
    lockChip(q.id, total+' / '+(q.items.length*2)+' pts', true);
    renderProgress(); renderNav();
  });

function renderMatching(q, body, card, slideIdx){
  const container = document.createElement('div');
  container.className = 'match-wrap';
  container.style.minHeight = (q.left.length*46)+'px';
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.classList.add('match-svg');
  container.appendChild(svg);
  const leftCol = document.createElement('div'); leftCol.className = 'match-col';
  const rightCol = document.createElement('div'); rightCol.className = 'match-col';
  const leftEls = q.left.map(name => { const el = document.createElement('div'); el.className='match-item'; el.textContent=name; leftCol.appendChild(el); return el; });
  const rightEls = q.right.map(name => { const el = document.createElement('div'); el.className='match-item'; el.textContent=name; rightCol.appendChild(el); return el; });
  container.appendChild(leftCol); container.appendChild(rightCol);
  body.appendChild(container);

  const actions = document.createElement('div');
  actions.className = 'actions-row';
  const resetBtn = document.createElement('button'); resetBtn.className='btn-ghost'; resetBtn.textContent='Réinitialiser';
  const submitBtn = document.createElement('button'); submitBtn.className='btn-blue'; submitBtn.textContent='Valider mes réponses';
  actions.appendChild(resetBtn); actions.appendChild(submitBtn);
  body.appendChild(actions);
  const feedbackZone = document.createElement('div');
  body.appendChild(feedbackZone);

  let connections = {}; let selectedLeft = null;

  function redraw(){
    const cr = container.getBoundingClientRect();
    svg.setAttribute('width', cr.width); svg.setAttribute('height', cr.height);
    svg.innerHTML = '';
    Object.keys(connections).forEach(li => {
      const ri = connections[li];
      const a = leftEls[li].getBoundingClientRect();
      const b = rightEls[ri].getBoundingClientRect();
      const x1 = a.right - cr.left, y1 = a.top - cr.top + a.height/2;
      const x2 = b.left - cr.left, y2 = b.top - cr.top + b.height/2;
      const line = document.createElementNS(svgNS,'line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      let color = '#1B2A4A';
      if(state[q.id].submitted){ const correct = q.pairs[q.left[li]] === q.right[ri]; color = correct ? '#1E7A46' : '#FF5A3C'; }
      line.setAttribute('stroke', color); line.setAttribute('stroke-width','2.5');
      svg.appendChild(line);
    });
  }
  matchingRedraws[slideIdx] = redraw;

  leftEls.forEach((el, li) => {
    el.addEventListener('click', () => {
      if(state[q.id].submitted) return;
      selectedLeft = li;
      leftEls.forEach((e,i)=>e.classList.toggle('selected', i===li));
    });
  });
  rightEls.forEach((el, ri) => {
    el.addEventListener('click', () => {
      if(state[q.id].submitted || selectedLeft===null) return;
      connections[selectedLeft] = ri;
      leftEls[selectedLeft].classList.add('connected');
      leftEls[selectedLeft].classList.remove('selected');
      selectedLeft = null;
      redraw();
    });
  });
  resetBtn.addEventListener('click', () => {
    if(state[q.id].submitted) return;
    connections = {}; selectedLeft = null;
    leftEls.forEach(e=>e.classList.remove('selected','connected'));
    redraw();
  });

  submitBtn.addEventListener('click', () => {
    if(state[q.id].submitted) return;
    state[q.id].submitted = true;
    let correctCount = 0;
    const lines = [];
    leftEls.forEach((el, li) => {
      const ri = connections[li];
      const isCorrect = ri!==undefined && q.pairs[q.left[li]] === q.right[ri];
      if(isCorrect) correctCount++;
      lines.push(q.left[li] + " → " + (ri!==undefined ? q.right[ri] : "(non relié)"));
      el.classList.remove('selected');
      el.classList.add(isCorrect ? 'correct-item' : 'incorrect-item');
      if(ri!==undefined) rightEls[ri].classList.add(isCorrect ? 'correct-item' : 'incorrect-item');
    });
    const earned = correctCount * q.pointsEach;
    state[q.id].earned = earned;
    state[q.id].answerText = lines.join(" / ");
    markSubmitted(card);
    lockChip(q.id, earned+' / '+(q.left.length*q.pointsEach)+' pts', true);
    submitBtn.disabled = true; resetBtn.disabled = true;
    redraw();
    const fb = document.createElement('div');
    fb.className = 'feedback-panel ' + (correctCount===q.left.length?'ok':'ko');
    fb.innerHTML = `<strong>${correctCount} / ${q.left.length} associations correctes (+${earned} pts)</strong>`;
    feedbackZone.appendChild(fb);
    renderProgress(); renderNav();
  });
  window.setTimeout(redraw, 50);
}

function renderUngraded(q, body, card){
  const ta = document.createElement('textarea');
  ta.rows = 3; ta.placeholder = "Votre réponse (non notée)…";
  body.appendChild(ta);
  const actions = document.createElement('div');
  actions.className = 'actions-row';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn-blue';
  submitBtn.textContent = 'Valider ma réponse';
  actions.appendChild(submitBtn);
  body.appendChild(actions);
  submitBtn.addEventListener('click', () => {
    if(state[q.id].submitted) return;
    ta.disabled = true; submitBtn.disabled = true;
    state[q.id].submitted = true;
    state[q.id].answerText = ta.value.trim() || "(pas de réponse)";
    renderProgress(); renderNav();
  });
}

/* ---------- final submission to server ---------- */
let quizSubmitted = false;
async function submitQuiz(){
  if(quizSubmitted) return;
  quizSubmitted = true;
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const btn = document.getElementById('submitAllBtn');
  btn.disabled = true; btn.textContent = "Envoi en cours…";

  const questionsMeta = QUESTIONS.map((q,i) => ({
    id:q.id, num:i+1, cat:q.cat, catLabel:CATS[q.cat].label, prompt:q.prompt, type:q.type, max:maxPossible(q)
  }));
  const answers = {};
  QUESTIONS.forEach(q => {
    const st = state[q.id];
    answers[q.id] = {
      text: st.answerText !== undefined ? st.answerText : "(sans réponse)",
      earned: st.earned || 0,
      max: maxPossible(q),
      needsManualGrade: needsManual(q),
      comment: ""
    };
  });

  try{
    const resp = await fetch('/api/submit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ firstName, lastName, totalMax: TOTAL_MAX, questions: questionsMeta, answers })
    });
    if(!resp.ok) throw new Error("Erreur serveur");
    document.getElementById('finalTitle').textContent = "Merci pour votre participation à ce Quizz !";
    document.getElementById('finalText').textContent = "Vos réponses ont bien été transmises. À très vite pour la correction.";
    document.getElementById('submitAllBtn')?.remove();
  } catch(e){
    quizSubmitted = false;
    btn.disabled = false; btn.textContent = "Réessayer l'envoi";
    document.getElementById('finalText').textContent = "L'envoi a échoué (vérifiez votre connexion) — réessayez.";
  }
}

renderProgress();
renderNav();
</script>
